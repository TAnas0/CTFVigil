services:
  redis:
    image: redis:7-alpine
    container_name: ctfvigil_redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  bot:
    build: .
    container_name: ctfvigil_bot
    command: python bot.py
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DISCORD_TOKEN=${DISCORD_TOKEN}
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import ctfvigil; import discord"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3
    restart: unless-stopped
    develop:
      watch:
        - action: sync+restart
          path: ./bot.py
          target: /app/bot.py
        - action: sync+restart
          path: ./ctfvigil
          target: /app/ctfvigil
        - action: sync+restart
          path: ./tasks
          target: /app/tasks
        - action: rebuild
          path: ./pyproject.toml

  worker:
    build: .
    container_name: ctfvigil_worker
    command: celery -A tasks.celery_app worker --loglevel=info
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL:-}
    healthcheck:
      test: ["CMD", "celery", "-A", "tasks.celery_app", "inspect", "ping", "--timeout", "5"]
      interval: 30s
      timeout: 15s
      start_period: 20s
      retries: 3
    restart: unless-stopped
    develop:
      watch:
        - action: sync+restart
          path: ./ctfvigil
          target: /app/ctfvigil
        - action: sync+restart
          path: ./tasks
          target: /app/tasks
        - action: rebuild
          path: ./pyproject.toml

  beat:
    build: .
    container_name: ctfvigil_beat
    command: celery -A tasks.celery_app beat -s /app/data/celerybeat-schedule --loglevel=info
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL:-}
    volumes:
      - beat_data:/app/data
    restart: unless-stopped
    develop:
      watch:
        - action: sync+restart
          path: ./tasks
          target: /app/tasks
        - action: rebuild
          path: ./pyproject.toml

volumes:
  redis_data:
  beat_data:
