services:
  redis:
    image: redis:7-alpine
    container_name: ctfvigil_redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  bot:
    build: .
    container_name: ctfvigil_bot
    command: python bot.py
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DISCORD_TOKEN=${DISCORD_TOKEN}
    restart: unless-stopped

  worker:
    build: .
    container_name: ctfvigil_worker
    command: celery -A tasks.celery_app worker --loglevel=info
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - REDIS_URL=redis://redis:6379/0
    restart: unless-stopped

  beat:
    build: .
    container_name: ctfvigil_beat
    command: celery -A tasks.celery_app beat -s /tmp/celerybeat-schedule --loglevel=info
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - REDIS_URL=redis://redis:6379/0
    restart: unless-stopped

volumes:
  redis_data:
